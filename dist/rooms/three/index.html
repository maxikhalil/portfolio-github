function fitScene(){
 const portrait=window.innerWidth<=900&&window.innerHeight>window.innerWidth;
 app.classList.toggle('portrait',portrait);
 document.body.classList.toggle('mobile-layout',portrait);
 const baseWidth=portrait?390:1920,baseHeight=portrait?730:1080;
 const scale=Math.min(window.innerWidth/baseWidth,window.innerHeight/baseHeight);
 // Keep the artwork and its controls in one reference coordinate system.
 // Portrait keeps its existing uniform fit; desktop fits the entire composition.
 app.style.width=baseWidth+'px';app.style.height=baseHeight+'px';
 app.style.setProperty('--scene-scale-x',portrait?scale:window.innerWidth/baseWidth);
 app.style.setProperty('--scene-scale-y',portrait?scale:window.innerHeight/baseHeight);
 const photoRatio=portrait?1:(window.innerHeight/baseHeight)/(window.innerWidth/baseWidth);

function markSelection(value){buttons.forEach(button=>{const active=button.dataset.project===value;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));});const b=buttons.find(b=>b.dataset.project===value);if(app.classList.contains('portrait')){selectorArrow.style.left=(b.offsetLeft+b.offsetWidth/2-16)+'px';selectorArrow.style.top='100.5px';}else{selectorArrow.style.left='406px';selectorArrow.style.top=(b.offsetTop+b.offsetHeight/2-115)+'px';}}
function pauseContextVideos(){for(const video of document.querySelectorAll('#contextArea video'))video.pause();}

document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseContextVideos();else if(selectedIndex!=='idle'&&stage.classList.contains('visible'))for(const video of document.querySelectorAll('#contextArea video'))if(!video.hidden&&video.dataset.userPaused!=='true')playContextVideo(video);});

function setIdleState(immediate=false){pauseContextVideos();++transitionToken;swapFloatingObject('cube',immediate);selectedIndex='idle';markSelection('idle');app.classList.remove('project-open');stage.classList.remove('visible');stage.setAttribute('aria-hidden','true');stage.inert=true;engine?.setVisible(false);document.querySelector('#engineStatus').hidden=true;}
async function ensureEngine(){if(engine)return engine;if(enginePromise){const viewer=await enginePromise;if(!viewer&&selectedIndex!=='idle')document.querySelector('#engineStatus').hidden=false;return viewer;}enginePromise=(async()=>{try{const [THREE,{OrbitControls},{GLTFLoader},{RoomEnvironment}]=await Promise.all([import('three'),import('three/addons/controls/OrbitControls.js'),import('three/addons/loaders/GLTFLoader.js'),import('three/addons/environments/RoomEnvironment.js')]);engine=createModelEngine(THREE,OrbitControls,GLTFLoader,RoomEnvironment);if(selectedIndex!=='idle'){engine.show(Number(selectedIndex));engine.setVisible(true);}return engine;}catch(err){console.warn('El visor 3D no se pudo iniciar.',err);if(selectedIndex!=='idle'){const status=document.querySelector('#engineStatus');status.textContent='No se pudo iniciar el visor 3D. Revisá la conexión y que WebGL esté habilitado.';status.hidden=false;}return null;}})();return enginePromise;}
function selectProject(index){
 if(selectedIndex===String(index))return;
 pauseContextVideos();
 const token=++transitionToken;
 selectedIndex=String(index);
 swapFloatingObject(projectForms[index]);
 markSelection(selectedIndex);
 app.classList.add('project-open');
 stage.classList.remove('visible');
 stage.setAttribute('aria-hidden','true');
 stage.inert=true;
 document.querySelector('#engineStatus').hidden=true;
 setTimeout(()=>{
  if(token!==transitionToken)return;
  const p=projects[index];
  document.querySelector('#projectTitle').textContent=p.title;
  document.querySelector('#projectTitle').style.maxWidth=p.titleWidth??'';
  document.querySelector('#projectDescription').textContent=p.description;
  showImages(p);
  if(engine){engine.show(index);engine.setVisible(true);}
  else{ensureEngine();}
  stage.classList.add('visible');
  stage.setAttribute('aria-hidden','false');
  stage.inert=false;

}
buttons.forEach((b,i)=>{b.addEventListener('click',()=>b.dataset.project==='idle'?setIdleState():selectProject(Number(b.dataset.project)));b.addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp','ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+((e.key==='ArrowDown'||e.key==='ArrowRight')?1:-1)+buttons.length)%buttons.length;buttons[n].focus();buttons[n].click();});});

for(const n of [1,2]){const card=document.querySelector('#contextCard'+n);card.addEventListener('click',()=>{if(card.classList.contains('has-video')){const video=card.querySelector('video');if(video.paused){video.dataset.userPaused='false';playContextVideo(video);card.setAttribute('aria-label','Pausar video de Cuphead');}else{video.pause();video.dataset.userPaused='true';card.setAttribute('aria-label','Reproducir video de Cuphead');}return;}if(!app.classList.contains('portrait')||!card.classList.contains('has-image'))return;expandedPhoto=card;document.querySelector('#largePhoto').src=document.querySelector('#contextImg'+n).src;document.querySelector('#photoLightbox').hidden=false;document.querySelector('#closePhoto').focus();});}

setIdleState(true);
function createModelEngine(THREE,OrbitControls,GLTFLoader,RoomEnvironment){
const container=document.querySelector('#threeCanvas');const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;container.appendChild(renderer.domElement);const scene=new THREE.Scene();const pmrem=new THREE.PMREMGenerator(renderer);const roomEnvironment=new RoomEnvironment();const studioEnvironment=pmrem.fromScene(roomEnvironment,.04).texture;roomEnvironment.dispose();pmrem.dispose();const camera=new THREE.PerspectiveCamera(32,1,.01,1000);camera.position.set(0,.75,5.5);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;controls.enableZoom=false;const modelElevation=THREE.MathUtils.degToRad(20);controls.minPolarAngle=Math.PI/2-modelElevation;controls.maxPolarAngle=controls.minPolarAngle;controls.target.set(0,.8,0);const fillLight=new THREE.HemisphereLight(0xffffff,0x282017,2.2);scene.add(fillLight);const keyLight=new THREE.DirectionalLight(0xffffff,3.2);keyLight.position.set(4,7,5);scene.add(keyLight);const rimLight=new THREE.DirectionalLight(0xffd266,1.6);rimLight.position.set(-5,3,-4);scene.add(rimLight);const modelRoot=new THREE.Group();scene.add(modelRoot);let activeModel=null;let activeOutlines=[];let originalMaterials=new Map();let referenceSize=1;const loader=new GLTFLoader();
function toonPlaceholder(){const g=new THREE.Group();const head=new THREE.Mesh(new THREE.IcosahedronGeometry(.8,4),new THREE.MeshStandardMaterial({color:'#e8b08f',roughness:.9}));head.scale.y=1.15;head.position.y=.85;const eyeMat=new THREE.MeshStandardMaterial({color:'#111'});const e1=new THREE.Mesh(new THREE.SphereGeometry(.075,20,20),eyeMat);e1.position.set(-.23,1.02,.7);e1.name='NO_OUTLINE_EYE_L';const e2=e1.clone();e2.position.x=.23;e2.name='NO_OUTLINE_EYE_R';g.add(head,e1,e2);return g}
function standardPlaceholderA(){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.TorusKnotGeometry(.66,.19,130,22),new THREE.MeshStandardMaterial({color:'#ae4e53',roughness:.32,metalness:.08}));m.position.y=.9;g.add(m);return g}
function standardPlaceholderB(){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.DodecahedronGeometry(.82,2),new THREE.MeshPhysicalMaterial({color:'#d8a83a',roughness:.24,clearcoat:.35}));m.position.y=.9;g.add(m);return g}

function gradientMap(steps=4){const data=new Uint8Array(steps);for(let i=0;i<steps;i++)data[i]=Math.round((i/(steps-1))*255);const texture=new THREE.DataTexture(data,steps,1,THREE.RedFormat);texture.needsUpdate=true;texture.minFilter=THREE.NearestFilter;texture.magFilter=THREE.NearestFilter;texture.generateMipmaps=false;return texture}const toonGradient=gradientMap(4);
function makeToonMaterial(original){const material=new THREE.MeshToonMaterial({color:original?.color?.clone?.()??new THREE.Color(0xffffff),map:original?.map??null,gradientMap:toonGradient});if(material.map)material.map.colorSpace=THREE.SRGBColorSpace;material.transparent=original?.transparent??false;material.opacity=original?.opacity??1;material.alphaTest=original?.alphaTest??0;material.side=original?.side??THREE.FrontSide;material.depthWrite=original?.depthWrite??true;material.depthTest=original?.depthTest??true;return material}
function applyToon(model){originalMaterials.clear();model.traverse(obj=>{if(!obj.isMesh||obj.userData.isOutline||obj.userData.toonApplied)return;obj.userData.toonApplied=true;originalMaterials.set(obj.uuid,obj.material);const originals=Array.isArray(obj.material)?obj.material:[obj.material];const toon=originals.map(makeToonMaterial);obj.material=Array.isArray(obj.material)?toon:toon[0]})}
function averageWorldScale(object){const scale=new THREE.Vector3();object.getWorldScale(scale);return Math.max((Math.abs(scale.x)+Math.abs(scale.y)+Math.abs(scale.z))/3,.00001)}
function extrudeGeometry(source,amount){const geometry=source.clone();if(!geometry.attributes.normal)geometry.computeVertexNormals();const pos=geometry.attributes.position;const normal=geometry.attributes.normal;for(let i=0;i<pos.count;i++)pos.setXYZ(i,pos.getX(i)+normal.getX(i)*amount,pos.getY(i)+normal.getY(i)*amount,pos.getZ(i)+normal.getZ(i)*amount);pos.needsUpdate=true;geometry.computeBoundingSphere();return geometry}
function clearOutlines(){activeOutlines.forEach(({outline})=>{outline.parent?.remove(outline);outline.geometry?.dispose?.();outline.material?.dispose?.()});activeOutlines=[]}
function createOutlines(model){clearOutlines();model.updateMatrixWorld(true);const sources=[];model.traverse(obj=>{if(!obj.isMesh||obj.userData.isOutline)return;if((obj.name||'').trim().toUpperCase().startsWith('NO_OUTLINE_'))return;sources.push(obj)});sources.forEach(mesh=>{const amount=referenceSize*.008/averageWorldScale(mesh);const geometry=extrudeGeometry(mesh.geometry,amount);const material=new THREE.MeshBasicMaterial({color:0x111111,side:THREE.BackSide,toneMapped:false});let outline;if(mesh.isSkinnedMesh){outline=new THREE.SkinnedMesh(geometry,material);outline.bindMode=mesh.bindMode;outline.bindMatrix.copy(mesh.bindMatrix);outline.bindMatrixInverse.copy(mesh.bindMatrixInverse);outline.bind(mesh.skeleton,mesh.bindMatrix)}else outline=new THREE.Mesh(geometry,material);outline.userData.isOutline=true;outline.position.copy(mesh.position);outline.quaternion.copy(mesh.quaternion);outline.scale.copy(mesh.scale);outline.frustumCulled=false;mesh.parent.add(outline);activeOutlines.push({source:mesh,outline})})}
function normalizeModel(model){model.scale.set(1,1,1);model.position.set(0,0,0);model.updateMatrixWorld(true);let box=new THREE.Box3().setFromObject(model);let size=box.getSize(new THREE.Vector3());const maxSize=Math.max(size.x,size.y,size.z,.0001);model.scale.multiplyScalar(2.65/maxSize);model.updateMatrixWorld(true);box=new THREE.Box3().setFromObject(model);const center=box.getCenter(new THREE.Vector3());model.position.x-=center.x;model.position.z-=center.z;model.position.y-=box.min.y;model.updateMatrixWorld(true);size=new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3());referenceSize=Math.max(size.x,size.y,size.z,.0001)}
// Project-specific neutral lighting, with the original rig restored for other models.
function setModelLighting(index){const light=projects[index].lighting??{};fillLight.intensity=light.fill??2.2;fillLight.groundColor.setHex(light.ground??0x282017);keyLight.intensity=light.key??3.2;keyLight.position.set(...(light.keyPosition??[4,7,5]));rimLight.intensity=light.rim??1.6;rimLight.color.setHex(light.rimColor??0xffd266);scene.environmentIntensity=light.environment??1;renderer.toneMappingExposure=light.exposure??1.1;}
function setThreeProject(index){setModelLighting(index);clearOutlines();if(activeModel)modelRoot.remove(activeModel);activeModel=projects[index].model;scene.environment=projects[index].modelUrl?studioEnvironment:null;if(!activeModel)return;normalizeModel(activeModel);modelRoot.add(activeModel);if(projects[index].toon){applyToon(activeModel);createOutlines(activeModel)}fitModel();}
function fitModel(){if(!activeModel)return;const box=new THREE.Box3().setFromObject(activeModel),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());const halfFov=THREE.MathUtils.degToRad(camera.fov/2),horizontalHalfFov=Math.atan(Math.tan(halfFov)*camera.aspect);const radius=Math.max(size.length()/2,.001);const distanceFactor=projects.find(project=>project.model===activeModel)?.cameraDistanceFactor??1;const distance=radius/Math.sin(Math.min(halfFov,horizontalHalfFov))*1.08*distanceFactor;controls.target.copy(center);camera.position.set(center.x,center.y+Math.sin(modelElevation)*distance,center.z+Math.cos(modelElevation)*distance);controls.minDistance=distance;controls.maxDistance=distance;controls.update();}

function modelStatus(index,message){if(selectedIndex!==String(index))return;const status=document.querySelector('#engineStatus');status.textContent=message;status.hidden=!message;}
async function loadIncludedModel(index){const project=projects[index];if(project.model||!project.modelUrl)return;if(!project.loading){project.loading=(async()=>{try{const gltf=await loader.loadAsync(project.modelUrl);if(!project.model)project.model=gltf.scene;return true;}catch(err){console.error('No se pudo cargar el modelo incluido.',err);return false;}finally{project.loading=null;}})();}modelStatus(index,'Cargando modelo…');const loaded=await project.loading;if(selectedIndex===String(index)){if(loaded){setThreeProject(index);modelStatus(index,'');}else{modelStatus(index,'No se pudo cargar el modelo. Volvé a seleccionarlo para reintentar.');}}}

function updateContextImages(project){const card1=document.querySelector('#contextCard1'),card2=document.querySelector('#contextCard2'),img1=document.querySelector('#contextImg1'),img2=document.querySelector('#contextImg2');if(project.imageA){img1.src=project.imageA;card1.classList.add('has-image')}else{img1.removeAttribute('src');card1.classList.remove('has-image')}if(project.imageB){img2.src=project.imageB;card2.classList.add('has-image')}else{img2.removeAttribute('src');card2.classList.remove('has-image')}}

let visible=false,lastTime=0;
function resize(){const w=container.clientWidth,h=container.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);const bounds=container.getBoundingClientRect(),aspect=bounds.width/bounds.height,changed=Math.abs(camera.aspect-aspect)>.001;camera.aspect=aspect;camera.updateProjectionMatrix();if(changed)fitModel();}resize();
function tick(time){requestAnimationFrame(tick);const dt=Math.min((time-lastTime)/1000,.05);lastTime=time;if(!visible||document.hidden)return;if(activeModel&&!reduceMotion)activeModel.rotation.y+=dt*.078;controls.update();renderer.render(scene,camera);}requestAnimationFrame(tick);
