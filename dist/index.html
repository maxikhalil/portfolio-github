    main {
      width: 100%;
      height: 100dvh;
      display: grid;
      place-items: center;
      touch-action: none;
      overflow: hidden;
      position: relative;
    }

    canvas {
      display: block;
      width: min(185vw, 180dvh, 3000px);
      height: min(185vw, 180dvh, 3000px);
      object-fit: contain;

      position: absolute;
      top: 50%;
      left: calc(50% + 84px);
      transform: translate(-50%, -50%);
      transition: transform 0.6s ease-in-out;
    }

    canvas.expanded {
      transform: translate(-50%, -50%) translateY(40px) scale(1.4);
    }

    @media (max-width: 700px) {
      /* El dibujo del frame frontal está 62 px a la izquierda del centro
         del PNG de 1920 px. Compensarlo en el tamaño visible del celular. */
      canvas {
        left: calc(50% + min(5.98vw, 5.81dvh, 96.9px));
        /* El punto de zoom coincide con el centro visible del rostro. */
        transform-origin: 46.77% 50%;
      }
    }

    canvas[hidden],
    #empty[hidden] {
      display: none;
    }

    #empty {
      text-align: center;
      padding: 25px;
      max-width: 420px;
    }

    #empty strong {
      font-size: 28px;
    }

    #empty p {
      line-height: 1.5;
    }

    header {
      position: fixed;
      z-index: 2;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 18px;
      background: #ffffff80;
      backdrop-filter: blur(12px);
    }

    .group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .upload {
      background: #17304c;
      color: white;
      padding: 11px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      position: relative;
    }

    .upload input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .upload:focus-within {
      outline: 3px solid #ec43ac;
    }

    label {
      font-size: 13px;
    }

    input[type="number"] {
      width: 56px;
      padding: 6px;
      border: 1px solid #17304c40;
      border-radius: 6px;
    }

    footer {
      position: fixed;
      bottom: 18px;
      left: 20px;
      right: 20px;
      text-align: center;
      font-size: 13px;
      pointer-events: none;
    }

    #message {
      margin-bottom: 6px;
    }
  .room-label { position:fixed; z-index:1; pointer-events:none;
      transform:translate(-50%,-100%); opacity:0; padding:9px 15px;
      border-radius:10px; background:#fff3c9; color:#463618;
      font-weight:bold; box-shadow:0 4px 18px #30200033; display:none; }
  #roomButtons { position:fixed; inset:0; z-index:1; pointer-events:none; }
  #roomButtons img { position:absolute; display:none; height:auto; max-width:none;
      transform-origin:center; image-rendering:auto; filter:blur(.95px); }
  @media(max-width:700px) { #roomButtons img { filter:blur(.4px); } }
  body.in-ambient #roomButtons { display:none; }
  #sectionHost {position:fixed;inset:0;z-index:20;background:#000;}
#sectionHost[hidden],#backHead[hidden]{display:none;}
#sectionHost iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
#backHead{position:fixed;left:24px;top:90px;z-index:30;display:block;width:120px;padding:0;border:0;background:transparent;cursor:pointer;line-height:0;transition:transform .18s ease;}
#backHead img{display:block;width:100%;height:auto;}
#backHead:hover{transform:rotate(-4deg) scale(1.04);}
#backHead:focus-visible{outline:3px solid #7044ff;outline-offset:4px;border-radius:12px;}
@media(prefers-reduced-motion:reduce){#backHead{transition:none;}}
#navFade{position:fixed;inset:0;z-index:100;opacity:0;pointer-events:none;background:#000;transition:opacity .35s ease;}
#navFade.cover{opacity:1;pointer-events:auto;}
#homeLogo {position:fixed;top:20px;left:24px;z-index:35;width:clamp(180px,20vw,280px);padding:0;border:0;background:transparent;cursor:pointer;}
#homeLogo img{display:block;width:100%;height:auto;}
#homeLogo:focus-visible{outline:3px solid #2d4bcd;outline-offset:6px;border-radius:8px;}
header{left:auto;right:16px;top:16px;width:auto;max-width:min(560px,90vw);padding:0;background:transparent;backdrop-filter:none;}
#devSettings{border-radius:12px;background:#ffffffbb;backdrop-filter:blur(12px);}
#devSettings summary{cursor:pointer;padding:10px 14px;font-size:12px;}
.settingsBody{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px;}
@media(max-width:600px){#homeLogo{left:12px;top:12px;width:170px;}header{top:auto;bottom:60px;}}

:root{--edge-space:58px;}
body{overflow:hidden;}
#stage{position:fixed;inset:0;width:auto;height:auto;}
#sectionHost{inset:0;}
#homeLogo{top:calc(var(--edge-space) + 12px);left:calc(var(--edge-space) + 16px);width:clamp(155px,16vw,220px);}
header{top:calc(var(--edge-space) + 12px);right:calc(var(--edge-space) + 12px);bottom:auto;max-width:calc(100vw - 2*var(--edge-space) - 24px);}
#backHead{left:24px;top:calc(clamp(72px, 5.42vw, 104px) + 12px);}
@media(max-width:600px){#backHead{width:96px;left:calc(16px + env(safe-area-inset-left));top:calc(72px + env(safe-area-inset-top));}}
footer{bottom:calc(var(--edge-space) + 8px);}
#iconBorder{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden;}

      <input id="threshold" type="number" min="2" max="45" value="12">
    </label>

    <label>Segundo cambio lateral %
      <input id="farThreshold" type="number" min="3" max="48" value="26">
    </label>

    <label>
      <input id="reverse" type="checkbox">
      Invertir recorrido vertical
    </label>
    <button id="restart" type="button" disabled>Volver a probar</button>
  </div></details></header>

  <main id="stage">
    <div id="empty">
      <strong>Tu cabeza va acá.</strong>
      <p>Cargá los PNG de las rotaciones y la apertura.
        Mové el cursor y hacé clic en la cabeza para abrirla.</p>
    </div>

    <canvas id="canvas" hidden role="img" aria-label="Cabeza que sigue la posición del cursor"></canvas>
  </main>
  <div id="roomButtons" aria-hidden="true"></div>

  <div id="roomLabel" class="room-label">Motions</div>
<div id="redRoomLabel" class="room-label">Tesis</div>
<div id="whiteRoomLabel" class="room-label">Ilustraciones</div>
<div id="cyanRoomLabel" class="room-label">3D</div>
<div id="sectionHost" hidden></div><button id="backHead" type="button" aria-label="Volver a la cabeza" title="Volver a la cabeza" hidden><img src="assets/botonVolver-v2.png" width="217" height="298" alt="" aria-hidden="true"></button><div id="navFade"></div>
<footer>
    <div id="message" role="status"></div>
    <div id="status">Esperando imágenes · Todo funciona localmente</div>
  </footer>

  <script>
    const $ = id => document.getElementById(id);
    const canvas = $("canvas");
    const ctx = canvas.getContext("2d");
    const stage = $("stage");

    // CONFIGURACIÓN: números incluidos, tanto inicio como fin.
    const config = {
      front: {
        name: "Frontal",
        start: 0,
        end: 15,
        center: 8
      },
      left: {
        name: "¾ izquierda",
        start: 16,
        end: 31,
        center: 24
      },
      farLeft: {
        name: "Izquierda máxima",
        start: 32,
        end: 47,
        center: 40
      },
      right: {
        name: "¾ derecha", start: 48, end: 63, center: 56
      },
      farRight: {
        name: "Derecha máxima", start: 64, end: 79, center: 72
      }
    };

    const order = ["farLeft", "left", "front", "right", "farRight"];

    const openingConfig = {start: 455, end: 464, fps: 18};
    let openingFrames = [];
    let mode = "tracking";
    let openingStarted = 0;
    let openingIndex = -1;
    let sequences = {};
    let pointerX = 0;
    let pointerY = 0.5;
    let activeView = "front";
    let lastTick = 0;
    let lastDrawn = null;
    let lastPaintTime = 0;
    let beforeOpening = null;
    let loadVersion = 0;

    const clamp = (value, min, max) =>
      Math.max(min, Math.min(max, value));

    function message(text) {
      $("message").textContent = text;
    }

    function numberOf(name) {
      const match = name.match(/(\d+)\.[^.]+$/);
      return match ? Number(match[1]) : null;
    }

    function chooseView() {
      const available = order.filter(key => sequences[key]);
      if (!available.length) return null;

      const first = clamp(
        Number($("threshold").value) || 12, 2, 45
      );

      const second = clamp(
        Number($("farThreshold").value) || 26,
        first + 2,
        48
      );

      $("farThreshold").min = first + 2;
      $("farThreshold").value = second;

      const distance = Math.abs(pointerX);
      const nearView = pointerX < 0 ? "left" : "right";
      const farView = pointerX < 0 ? "farLeft" : "farRight";
      const onSameSide = activeView === nearView || activeView === farView;
      const margin = 0.008;

      const firstBoundary = first / 100 +
        (onSameSide ? -margin : margin);

      const secondBoundary = second / 100 +
        (activeView === farView ? -margin : margin);

      const desired = distance >= secondBoundary
        ? farView
        : distance >= firstBoundary
          ? nearView
          : "front";

      if (available.includes(desired)) return desired;

      const desiredIndex = order.indexOf(desired);

      return available.reduce((best, key) =>
        Math.abs(order.indexOf(key) - desiredIndex) <
          Math.abs(order.indexOf(best) - desiredIndex)
          ? key
          : best
      );
    }

    function calculateFrame(sequence) {
      const middle = sequence.centerIndex;
      const y = $("reverse").checked ? 1 - pointerY : pointerY;

      if (Math.abs(y - 0.5) <= 0.035) return middle;

      if (y < 0.5) {
        return Math.round(y * 2 * middle);
      }

      return middle + Math.round(
        (y - 0.5) * 2 * (sequence.frames.length - 1 - middle)
      );
    }

    function render() {
      if (mode !== "tracking") return;
      const view = chooseView();
      if (!view) return;

      activeView = view;

      const sequence = sequences[view];
      const frame = sequence.frames[calculateFrame(sequence)];

      // Repintar periódicamente por si el navegador descartó la superficie
      // del canvas al liberar memoria entre visitas a los ambientes.
      if (frame !== lastDrawn || performance.now() - lastPaintTime > 1000) {
        const width = frame.image.width;
        const height = frame.image.height;

        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(frame.image, 0, 0);
        lastDrawn = frame;
        lastPaintTime = performance.now();
      }

      canvas.hidden = false;
      $("empty").hidden = true;

      $("status").textContent =
        `${sequence.name} · ${frame.name} · ` +
        `${sequence.frames.length} imágenes`;
    }

    async function decodeFile(file) {
      const url = URL.createObjectURL(file);
      const image = new Image();

      try {
        await new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = () =>
            reject(new Error(`No pude abrir ${file.name}`));
          image.src = url;
        });

        const preview = document.createElement("canvas");
        preview.width = Math.min(matchMedia("(max-width: 700px)").matches ? 720 : 960, image.naturalWidth);
        preview.height = Math.round(image.naturalHeight * preview.width / image.naturalWidth);
        const previewContext = preview.getContext("2d");
        previewContext.imageSmoothingQuality = "high";
        previewContext.drawImage(image, 0, 0, preview.width, preview.height);
        return {
          image: preview,
          sourceWidth: image.naturalWidth,
          sourceHeight: image.naturalHeight,
          name: file.name,
          number: numberOf(file.name)
        };
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    async function loadFrames(selected, input = null) {
      if (!selected.length) return;

      const version = ++loadVersion;
      $("loadLabel").textContent = "Cargando…";
      message("");

      try {
        const byNumber = new Map();

        for (const file of selected) {
          const number = numberOf(file.name);

          if (number === null) {
            throw new Error(
              `${file.name}: el nombre debe terminar en un número antes de .png.`
            );
          }

          if (byNumber.has(number)) {
            throw new Error(
              `Hay dos archivos con el número ${number}. ` +
              "Cada frame debe tener un número único."
            );
          }

          byNumber.set(number, file);
        }

        const usedNumbers = new Set();

        for (const settings of Object.values(config)) {
          const {start, end, center, name} = settings;

          if (
            ![start, end, center].every(Number.isInteger) ||
            start < 0 || end < start ||
            center < start || center > end
          ) {
            throw new Error(`Revisá los rangos de ${name} en config.`);
          }

          const missing = [];

          for (let number = start; number <= end; number++) {
            if (usedNumbers.has(number)) {
              throw new Error(
                `El frame ${number} aparece en dos rangos de config.`
              );
            }

            usedNumbers.add(number);

            if (!byNumber.has(number)) missing.push(number);
          }

          if (missing.length) {
            throw new Error(
              `${name}: faltan los frames ${missing.join(", ")}. ` +
              "Seleccioná todos los PNG o corregí el rango en config."
            );
          }
        }

        for (let n = openingConfig.start; n <= openingConfig.end; n++) {
          if (!byNumber.has(n)) throw new Error(`Falta el frame ${n} de la apertura.`);
          if (usedNumbers.has(n)) throw new Error(`El frame ${n} está en dos rangos.`);
          usedNumbers.add(n);
        }
        const numbers = Array.from(usedNumbers).sort((a, b) => a - b);
        const loaded = [];
        for (let i = 0; i < numbers.length; i += 3) {
          if (version !== loadVersion) return;
          loaded.push(...await Promise.all(
            numbers.slice(i, i + 3).map(number => decodeFile(byNumber.get(number)))
          ));
          $("loadLabel").textContent = `Cargando ${loaded.length}/${numbers.length}…`;
        }

        if (version !== loadVersion) return;

        const first = loaded[0];

        if (loaded.some(frame =>
          frame.sourceWidth !== first.sourceWidth ||
          frame.sourceHeight !== first.sourceHeight
        )) {
          throw new Error(
            "Todos los PNG, incluida la apertura, deben tener la misma resolución."
          );
        }

        const decoded = new Map(
          loaded.map(frame => [frame.number, frame])
        );

        const nextSequences = {};

        for (const [key, settings] of Object.entries(config)) {
          const frames = [];

          for (let number = settings.start; number <= settings.end; number++) {
            frames.push(decoded.get(number));
          }

          nextSequences[key] = {
            name: settings.name,
            frames,
            centerIndex: frames.findIndex(
              frame => frame.number === settings.center
            )
          };
        }

        // Solo reemplaza las secuencias si toda la carga fue correcta.
        openingFrames = Array.from(
          {length: openingConfig.end - openingConfig.start + 1},
          (_, i) => decoded.get(openingConfig.start + i)
        );
        mode = "tracking";
        clearRoom();
        canvas.classList.remove("expanded");
        openingIndex = -1;
        $("restart").disabled = false;
        canvas.style.cursor = "default";
        sequences = nextSequences;
        pointerX = 0;
        pointerY = 0.5;
        activeView = "front";
        lastDrawn = null;
        beforeOpening = null;

        render();

        const extra = selected.length - loaded.length;

        message(
          `${loaded.length} PNG cargados · ` +
          `${Object.keys(sequences).length} vistas + apertura · Hacé clic en la cabeza` +
          (extra ? ` · ${extra} archivos fuera de los rangos, sin usar` : "")
        );
      } catch (error) {
        if (version === loadVersion) message(error.message);
      } finally {
        if (version === loadVersion) {
          $("loadLabel").textContent = "Cargar todos los PNG";
          if (input) input.value = "";
        }
      }
    }

    $("allFiles").addEventListener("change", event => {
      const input = event.target;
      loadFrames(Array.from(input.files).filter(file => /\.png$/i.test(file.name)), input);
    });

    // Estos PNG viajan con el Site: también cargan al abrirlo desde el celular.
    const bundledFrames = ["pruebaCara_00000.png", "pruebaCara_00001.png", "pruebaCara_00002.png", "pruebaCara_00003.png", "pruebaCara_00004.png", "pruebaCara_00005.png", "pruebaCara_00006.png", "pruebaCara_00007.png", "pruebaCara_00008.png", "pruebaCara_00009.png", "pruebaCara_00010.png", "pruebaCara_00011.png", "pruebaCara_00012.png", "pruebaCara_00013.png", "pruebaCara_00014.png", "pruebaCara_00015.png", "pruebaCara2_00016.png", "pruebaCara2_00017.png", "pruebaCara2_00018.png", "pruebaCara2_00019.png", "pruebaCara2_00020.png", "pruebaCara2_00021.png", "pruebaCara2_00022.png", "pruebaCara2_00023.png", "pruebaCara2_00024.png", "pruebaCara2_00025.png", "pruebaCara2_00026.png", "pruebaCara2_00027.png", "pruebaCara2_00028.png", "pruebaCara2_00029.png", "pruebaCara2_00030.png", "pruebaCara2_00031.png", "pruebaCara3_00032.png", "pruebaCara3_00033.png", "pruebaCara3_00034.png", "pruebaCara3_00035.png", "pruebaCara3_00036.png", "pruebaCara3_00037.png", "pruebaCara3_00038.png", "pruebaCara3_00039.png", "pruebaCara3_00040.png", "pruebaCara3_00041.png", "pruebaCara3_00042.png", "pruebaCara3_00043.png", "pruebaCara3_00044.png", "pruebaCara3_00045.png", "pruebaCara3_00046.png", "pruebaCara3_00047.png", "pruebaCaraD1_00048.png", "pruebaCaraD1_00049.png", "pruebaCaraD1_00050.png", "pruebaCaraD1_00051.png", "pruebaCaraD1_00052.png", "pruebaCaraD1_00053.png", "pruebaCaraD1_00054.png", "pruebaCaraD1_00055.png", "pruebaCaraD1_00056.png", "pruebaCaraD1_00057.png", "pruebaCaraD1_00058.png", "pruebaCaraD1_00059.png", "pruebaCaraD1_00060.png", "pruebaCaraD1_00061.png", "pruebaCaraD1_00062.png", "pruebaCaraD1_00063.png", "pruebaCaraD2_00064.png", "pruebaCaraD2_00065.png", "pruebaCaraD2_00066.png", "pruebaCaraD2_00067.png", "pruebaCaraD2_00068.png", "pruebaCaraD2_00069.png", "pruebaCaraD2_00070.png", "pruebaCaraD2_00071.png", "pruebaCaraD2_00072.png", "pruebaCaraD2_00073.png", "pruebaCaraD2_00074.png", "pruebaCaraD2_00075.png", "pruebaCaraD2_00076.png", "pruebaCaraD2_00077.png", "pruebaCaraD2_00078.png", "pruebaCaraD2_00079.png", "pruebaCara4_00455.png", "pruebaCara4_00456.png", "pruebaCara4_00457.png", "pruebaCara4_00458.png", "pruebaCara4_00459.png", "pruebaCara4_00460.png", "pruebaCara4_00461.png", "pruebaCara4_00462.png", "pruebaCara4_00463.png", "pruebaCara4_00464.png"];
    async function loadBundledFrames() {
      const version = ++loadVersion;
      const selected = [];
      message("Cargando la cabeza…");
      try {
        for (let i = 0; i < bundledFrames.length; i += 6) {
          if (version !== loadVersion) return;
          const batch = await Promise.all(bundledFrames.slice(i, i + 6).map(async name => {
            const response = await fetch(`frames/${encodeURIComponent(name)}`);
            if (!response.ok) throw new Error(`No pude cargar ${name} (${response.status}).`);
            return new File([await response.blob()], name, {type: "image/png"});
          }));
          selected.push(...batch);
          message(`Cargando la cabeza… ${selected.length}/${bundledFrames.length}`);
        }
        if (version === loadVersion) await loadFrames(selected);
      } catch (error) {
        if (version === loadVersion) message(`${error.message} Podés cargar los PNG manualmente en Ajustes.`);
      }
    }
    loadBundledFrames();

    function track(event) {
      if (mode !== "tracking") return;
      const rect = stage.getBoundingClientRect();
      const centerY = rect.top + rect.height / 2;

      // Conserva tu sensibilidad vertical.
      const range = rect.height * 0.4;

      pointerY = clamp(
        0.5 + (event.clientY - centerY) / range, 0, 1
      );

      pointerX =
        (event.clientX - rect.left) / rect.width - 0.5;
    }

    function reset() {
      pointerX = 0;
      pointerY = 0.5;
    }

    // Seguir el cursor sobre toda la página, incluido el logo y los controles.
    document.addEventListener("pointermove", track, { capture: true, passive: true });
    document.addEventListener("pointerdown", track, { capture: true, passive: true });
    document.documentElement.addEventListener("pointerleave", reset);
    document.addEventListener("pointercancel", reset);
    window.addEventListener("blur", reset);

    ["reverse", "threshold", "farThreshold"].forEach(id => {
      $(id).addEventListener("change", render);
    });

    function restart() {
      if (!sequences.front) return;
      mode = "tracking";
      clearRoom();
      openingIndex = -1;
      pointerX = 0;
      pointerY = 0.5;
      activeView = "front";
      lastDrawn = null;
      canvas.style.cursor = "default";
      message("");
      render();
      canvas.classList.remove("expanded");
    }
    $("restart").addEventListener("click", restart);

    function isOverInteraction(event) {
      if (mode !== "tracking" || !openingFrames.length) return false;

      const rect = canvas.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const radiusX = 300;  // Mitad del ancho.
      const radiusY = 450; // Mitad de la altura.

      const dx = (event.clientX - centerX) / radiusX;
      const dy = (event.clientY - centerY) / radiusY;

      if (dx * dx + dy * dy > 1) return false;

      const scale = Math.min(
        rect.width / canvas.width,
        rect.height / canvas.height
      );

      const offsetX = (rect.width - canvas.width * scale) / 2;
      const offsetY = (rect.height - canvas.height * scale) / 2;

      const x = Math.floor(
        (event.clientX - rect.left - offsetX) / scale
      );
      const y = Math.floor(
        (event.clientY - rect.top - offsetY) / scale
      );

      if (
        x < 0 || y < 0 ||
        x >= canvas.width || y >= canvas.height
      ) return false;

      return ctx.getImageData(x, y, 1, 1).data[3] >= 20;
    }

    canvas.addEventListener("pointermove", event => {
      canvas.style.cursor = isOverInteraction(event)
        ? "pointer"
        : "default";
    });

    canvas.addEventListener("pointerleave", () => {
      canvas.style.cursor = "default";
    });


    canvas.addEventListener("click", event => {
      if (!isOverInteraction(event)) return;
      beforeOpening = {
        frame: lastDrawn,
        x: pointerX,
        y: pointerY,
        view: activeView
      };
      restart();
      mode = "centering";
      canvas.classList.add("expanded");
      openingStarted = performance.now() + 1000 / openingConfig.fps;
      canvas.style.cursor = "default";
    });


    // Zonas trazadas con la imagen HD de los ambientes y alineadas al frame 464.
    // Se escalan al tamaño real del canvas para conservar la selección al redimensionar.
    let rooms = [];
    let roomSize = null;
    let roomTime = 0;
    let roomPointer = null;
    const roomButtons = {
      redRoomLabel:   {src:"assets/TESISbot.png", x:900, y:274, width:150, angle:-6},
      whiteRoomLabel: {src:"assets/2Dbot.png", x:770, y:385, width:120, angle:6},
      cyanRoomLabel:  {src:"assets/3Dbot.png", x:1030, y:385, width:120, angle:-6},
      roomLabel:      {src:"assets/ANIMbot.png", x:900, y:818, width:220, angle:5}
    };
    for (const button of Object.values(roomButtons)) {
      button.image = new Image();
      button.image.src = button.src;
      $("roomButtons").appendChild(button.image);
    }

    function clearRoom() {
      // Las cuatro máscaras ocupan memoria de canvas. Se reutilizan en cada
      // apertura en vez de crear otras cuatro después de cada cierre.
      for (const room of rooms) { room.opacity = 0; room.tilt = 0; }
      for (const button of Object.values(roomButtons)) button.image.style.display = "none";
      $("roomLabel").style.opacity = 0;
      $("redRoomLabel").style.opacity = 0;
      $("whiteRoomLabel").style.opacity = 0;
      $("cyanRoomLabel").style.opacity = 0;
    }

    function buildRoom() {
      clearRoom();
      const w = canvas.width, h = canvas.height;
      if (roomSize?.w === w && roomSize?.h === h && rooms.length === 4) {
        message("Pasá el mouse por cualquiera de los cuatro ambientes.");
        return;
      }
      for (const room of rooms) { room.layer.width = 0; room.layer.height = 0; }
      rooms = [];
      roomSize = {w, h};
      const definitions = [
        // Los trazos quedan por dentro de los marcos de madera y las divisiones.
        {label:"redRoomLabel", points:[[658,306],[660,290],[668,265],[678,240],[690,215],[703,190],[720,170],[743,150],[772,132],[809,120],[850,112],[899,109],[948,112],[991,120],[1023,132],[1051,150],[1072,170],[1093,190],[1110,215],[1126,240],[1139,265],[1147,290],[1150,306]], color:[216,116,255]},
        {label:"whiteRoomLabel", points:[[652,352],[890,352],[890,624],[708,624],[702,602],[695,571],[690,550],[684,500],[673,450],[662,400],[652,352]], color:[255,239,180], blend:"source-over"},
        {label:"cyanRoomLabel", points:[[928,352],[1150,352],[1130,400],[1119,450],[1110,500],[1098,550],[1090,600],[1085,624],[928,624]], color:[97,235,255]},
        {label:"roomLabel", points:[[730,669],[1077,669],[1073,680],[1067,700],[1057,725],[1044,750],[1032,775],[1020,800],[1011,825],[998,844],[805,844],[795,825],[789,800],[778,775],[765,750],[751,725],[741,700],[736,680]], color:[255,109,117]}
      ];
      for (const definition of definitions) {
      const layer = document.createElement("canvas");
      layer.width = w; layer.height = h;
      const lc = layer.getContext("2d");
      // Extender cada contorno hasta los bordes visibles del ambiente; la
      // máscara del glow y el área clickeable comparten el mismo trazado.
      const roomScale=1.04;
      const originalX=definition.points.map(([x])=>x);
      const originalY=definition.points.map(([,y])=>y);
      const centerX=(Math.min(...originalX)+Math.max(...originalX))/2;
      const centerY=(Math.min(...originalY)+Math.max(...originalY))/2;
      const points=definition.points.map(([x,y])=>[
        (centerX+(x-centerX)*roomScale)*w/1920,
        (centerY+(y-centerY)*roomScale)*h/1080
      ]);
      const path=new Path2D();
      path.moveTo(...points[0]);
      for(const point of points.slice(1)) path.lineTo(...point);
      path.closePath();
      const xs=points.map(p=>p[0]), ys=points.map(p=>p[1]);
      const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
      lc.clip(path);
      const fade=lc.createLinearGradient(0,y0,0,y1+1);
      const [r,g,b]=definition.color;
      fade.addColorStop(0,`rgba(${r},${g},${b},0.06)`);
      fade.addColorStop(0.55,`rgba(${r},${g},${b},0.28)`);
      fade.addColorStop(1,`rgba(${r},${g},${b},0.72)`);
      lc.fillStyle=fade;lc.fillRect(0,0,w,h);
      rooms.push({path,layer,x0,y0,x1,y1,label:definition.label,blend:definition.blend||"screen",opacity:0,tilt:0});
      }
      message("Pasá el mouse por cualquiera de los cuatro ambientes.");
    }

    function roomGeometry() {
      const r=canvas.getBoundingClientRect();
      const scale=Math.min(r.width/canvas.width,r.height/canvas.height);
      return {scale,left:r.left+(r.width-canvas.width*scale)/2,
        top:r.top+(r.height-canvas.height*scale)/2};
    }

    function overRoom(event, room) {
      if(mode!=="open" || !room || !event) return false;
      const g=roomGeometry();
      const x=Math.floor((event.clientX-g.left)/g.scale);
      const y=Math.floor((event.clientY-g.top)/g.scale);
      return x>=0 && y>=0 && x<canvas.width && y<canvas.height &&
        ctx.isPointInPath(room.path,x,y);
    }

    canvas.addEventListener("pointermove", event => {
      roomPointer={clientX:event.clientX,clientY:event.clientY};
    });
    canvas.addEventListener("pointerleave", () => {roomPointer=null;});
    window.addEventListener("blur", () => {roomPointer=null;});

    function drawRoom(now) {
      if (activeSection || navigating) return;
      const dt=Math.min(50,now-(roomTime||now)); roomTime=now;
      if(mode!=="open" || !rooms.length) return;
      const active=rooms.find(room=>overRoom(roomPointer,room));
      canvas.style.cursor=active?"pointer":"default";
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(openingFrames[openingFrames.length-1].image,0,0);
      const g=roomGeometry();
      for(const room of rooms) {
        const target=room===active?1:0;
        room.opacity+=Math.sign(target-room.opacity)*Math.min(Math.abs(target-room.opacity),dt/220);
        if(room.opacity > 0){
          ctx.save();
          ctx.globalAlpha=room.opacity;
          ctx.globalCompositeOperation=room.blend;
          ctx.drawImage(room.layer,0,0);
          ctx.restore();
        }
        const label=$(room.label);
        label.style.left=(g.left+(room.x0+room.x1)/2*g.scale)+"px";
        label.style.top=(g.top+room.y1*g.scale-12)+"px";
        label.style.opacity=room.opacity;
      }
      // Las imágenes quedan fuera del canvas reducido: el navegador muestra
      // los PNG originales al tamaño final y conserva su nitidez.
      const sx=canvas.width/1920, sy=canvas.height/1080;
      for(const room of rooms) {
        const button=roomButtons[room.label];
        if(!button.image.complete || !button.image.naturalWidth) continue;
        const target=room===active?button.angle:0;
        room.tilt+=(target-room.tilt)*Math.min(1,dt/140);
        const scale=room===active?1.06:1;
        button.image.style.display="block";
        button.image.style.left=(g.left+button.x*sx*g.scale)+"px";
        button.image.style.top=(g.top+button.y*sy*g.scale)+"px";
        button.image.style.width=(button.width*sx*g.scale)+"px";
        button.image.style.transform=`translate(-50%,-50%) rotate(${room.tilt}deg) scale(${scale})`;
      }
    }

    let closingStarted=0;
    let closingFrom=0;
    let homeBusy=false;
    function finishClosing(){
      mode='tracking';
      openingIndex=-1;
      clearRoom();
      roomPointer=null;
      pointerX=0;
      pointerY=0.5;
      activeView='front';
      lastDrawn=null;
      canvas.style.cursor='default';
      canvas.classList.remove('expanded');
      render();
      message('');
    }
    function startClosing(){
      if(!openingFrames.length || mode==='tracking' || mode==='closing')return;
      closingFrom=mode==='open'?openingFrames.length-1:Math.max(0,openingIndex);
      closingStarted=performance.now();
      mode='closing';roomPointer=null;clearRoom();
      canvas.style.cursor='default';
    }
    $('homeLogo').addEventListener('click',async()=>{
      if(navigating||homeBusy)return;
      homeBusy=true;
      try{if(activeSection)await backToHead();startClosing();}finally{homeBusy=false;}
    });
    function syncIntro() {
      const hidden = mode !== "tracking" || Boolean(activeSection);
      const intro = $("introCopy");
      intro.classList.toggle("is-hidden", hidden);
      intro.setAttribute("aria-hidden", String(hidden));
    }

    function animate(now) {
      // Agendar primero el próximo cuadro: un error puntual de dibujo no debe
      // detener para siempre el loop y dejar la cabeza invisible.
      requestAnimationFrame(animate);
      if (ctx.isContextLost()) return;
      if (mode === "tracking") {
        const fps = clamp(Number($("fps").value) || 30, 1, 60);
        if (now - lastTick >= 1000 / fps) {
          lastTick = now;
          render();
        }
      } else if ((mode === "centering" || mode === "opening") && now >= openingStarted) {
        mode = "opening";
        const step = Math.floor((now - openingStarted) * openingConfig.fps / 1000);
        const index = Math.min(step, openingFrames.length - 1);
        if (index !== openingIndex) {
          const frame = openingFrames[index];
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(frame.image, 0, 0);
          openingIndex = index;
          $("status").textContent = `Apertura · ${frame.name} · ${openingConfig.fps} fps`;
        }
        if (step >= openingFrames.length) {
          mode = "open";
          buildRoom();
          $("status").textContent = "Elegí un ambiente · Tocá el logo para cerrar la cabeza";
        }
      }
      if(mode==='closing'){
        const step=Math.floor((now-closingStarted)*openingConfig.fps/1000);
        if(step>=closingFrom){
          // Restaurar la imagen visible antes de abrir; el primer frame de
          // apertura puede ser transparente y no sirve como estado cerrado.
          finishClosing();
        }else{
          const index=closingFrom-step;
          ctx.clearRect(0,0,canvas.width,canvas.height);
          ctx.drawImage(openingFrames[index].image,0,0);
          $('status').textContent='Cerrando cabeza…';
        }
      }
      drawRoom(now);
      syncIntro();
    }

    canvas.addEventListener('contextlost', event => {
      event.preventDefault();
      lastDrawn = null;
    });
    canvas.addEventListener('contextrestored', () => {
      lastDrawn = null;
      openingIndex = -1;
      if (mode === 'tracking') render();
      if (mode === 'open') drawRoom(performance.now());
    });


// Cada ambiente se sirve desde su versión integrada, con recursos relativos propios.
const sectionPaths={motions:'rooms/motions/index.html',three:'rooms/three/index.html',illustrations:'rooms/illustrations/index.html',thesis:'rooms/thesis/index.html'};

const sectionNames={motions:'Motions',three:'3D',illustrations:'Ilustraciones',thesis:'Tesis'};
const sectionByLabel={roomLabel:'motions',redRoomLabel:'thesis',whiteRoomLabel:'illustrations',cyanRoomLabel:'three'};
const sectionFrames={};let activeSection=null;let navigating=false;
const delay=ms=>new Promise(r=>setTimeout(r,ms));
async function enterSection(key){if(navigating||activeSection||mode!=='open')return;navigating=true;$('navFade').classList.add('cover');await delay(360);document.querySelectorAll('.room-label').forEach(l=>l.style.opacity=0);roomPointer=null;$('sectionHost').hidden=false;Object.values(sectionFrames).forEach(f=>f.hidden=true);let frame=sectionFrames[key];if(!frame){frame=document.createElement('iframe');frame.title=sectionNames[key];frame.allow='autoplay; fullscreen';const ready=new Promise(r=>frame.onload=r);frame.src=sectionPaths[key];sectionFrames[key]=frame;$('sectionHost').appendChild(frame);await ready;}frame.hidden=false;activeSection=key;document.body.classList.add("in-ambient");$('backHead').hidden=false;frame.contentWindow.dispatchEvent(new Event('resize'));await delay(50);$('navFade').classList.remove('cover');await delay(360);navigating=false;}
async function backToHead(){if(navigating||!activeSection)return;navigating=true;$('navFade').classList.add('cover');await delay(360);const f=sectionFrames[activeSection],doc=f.contentDocument;if(doc){doc.querySelectorAll('video,audio').forEach(m=>m.pause());const rec=doc.querySelector('.record.playing');if(rec)rec.click();}f.remove();delete sectionFrames[activeSection];$('sectionHost').hidden=true;$('backHead').hidden=true;activeSection=null;document.body.classList.remove("in-ambient");roomPointer=null;rooms.forEach(r=>r.opacity=0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(openingFrames.at(-1).image,0,0);canvas.style.cursor='default';$('navFade').classList.remove('cover');await delay(360);navigating=false;}
$('backHead').addEventListener('click',backToHead);
canvas.addEventListener('click',e=>{if(mode!=='open'||navigating||activeSection)return;const r=rooms.find(r=>overRoom(e,r));if(r)enterSection(sectionByLabel[r.label]);});
requestAnimationFrame(animate);


// Una sola fila de iconos recorre el perímetro, siempre derechos.
const borderLayer=document.getElementById('iconBorder');
const borderSymbols=['✦','♥','✿','◆','☀','★','●','✧'];
const borderColors=['#2b4bd1','#ff502b','#a5cc58','#ed70b8','#f7b827'];
const borderMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
let borderPaused=borderMotion.matches;
let borderItems=[],borderWidth=0,borderHeight=0,borderInset=0,borderPhase=0,borderLast=0;
function borderPoint(distance,w,h){
 const p=2*(w+h);let d=((distance%p)+p)%p;
 if(d<w)return [d,0];d-=w;
 if(d<h)return [w,d];d-=h;
 if(d<w)return [w-d,h];d-=w;
 return [0,h-d];
}
function layoutBorder(){
 borderInset=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--edge-space'))/2;
 borderWidth=Math.max(1,innerWidth-2*borderInset);borderHeight=Math.max(1,innerHeight-2*borderInset);
 const count=Math.max(8,Math.floor(2*(borderWidth+borderHeight)/(innerWidth<600?48:60)));
 borderLayer.replaceChildren();borderItems=[];
 for(let i=0;i<count;i++){
  const icon=document.createElement('span');icon.className='border-icon';icon.textContent=borderSymbols[i%borderSymbols.length];icon.style.color=borderColors[i%borderColors.length];borderLayer.appendChild(icon);borderItems.push(icon);
 }
 drawBorder();
}
function drawBorder(){
 const perimeter=2*(borderWidth+borderHeight);
 borderItems.forEach((icon,i)=>{const [x,y]=borderPoint(borderPhase+i*perimeter/borderItems.length,borderWidth,borderHeight);icon.style.transform=`translate(${x+borderInset}px,${y+borderInset}px) translate(-50%,-50%)`;});
}
function updateBorderButton(){const b=document.getElementById('pauseBorder');b.textContent=borderPaused?'▶':'Ⅱ';b.title=borderPaused?'Animar marco':'Pausar marco animado';b.setAttribute('aria-label',b.title);}
document.getElementById('pauseBorder').onclick=()=>{borderPaused=!borderPaused;updateBorderButton();};
borderMotion.addEventListener('change',e=>{borderPaused=e.matches;updateBorderButton();});
function animateBorder(now){
 const dt=borderLast?Math.min(now-borderLast,60):0;borderLast=now;
 if(!borderPaused){borderPhase=(borderPhase+dt*0.04)%(2*(borderWidth+borderHeight));drawBorder();}
 requestAnimationFrame(animateBorder);
}
window.addEventListener('resize',layoutBorder);layoutBorder();updateBorderButton();requestAnimationFrame(animateBorder);

</script></body></html>
